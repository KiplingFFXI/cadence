# Drafts a GitHub release when a push to main changes addon.version in cadence/cadence.lua, when you push a tag
# like v1.0.1 for that version, or when it's run by hand. The draft holds the zip with the sounds and that
# version's CHANGELOG.md section. Only people with write access to the repo see it until it's published.
name: Draft release

on:
  push:
    branches: [main]
    paths: [cadence/cadence.lua]
    # GitHub doesn't check paths for a tag, so every version tag runs this.
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

# Pushing main and its tag together starts two runs. The second waits for the first, so it sees the draft.
concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  draft:
    needs: verify
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Check the version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          read_version() { sed -nE "s/^addon\.version *= *'([^']+)';.*/\1/p"; }
          version=$(read_version < cadence/cadence.lua)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A tag has to name the version cadence.lua has at that commit.
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "The tag $GITHUB_REF_NAME doesn't match addon.version $version in cadence/cadence.lua."
              exit 1
            fi
          # A run by hand has no commit before it, and neither does the first push of main.
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            if ! git fetch --quiet --depth 1 origin "$BEFORE"; then
              echo "Could not read the previous commit. No release was drafted."
              exit 1
            fi
            if [ "$(git show "$BEFORE:cadence/cadence.lua" | read_version)" = "$version" ]; then
              echo "This push didn't change addon.version from $version."
              exit 0
            fi
          fi
          tags=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          if printf '%s\n' "$tags" | grep -qx "v$version"; then
            echo "v$version already has a release."
            exit 0
          fi
          echo "draft=true" >> "$GITHUB_OUTPUT"

      - name: Build the zip
        if: steps.version.outputs.draft == 'true'
        run: python tools/build_release.py --out "$RUNNER_TEMP"

      - name: Draft the release
        if: steps.version.outputs.draft == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The notes are the lines under "## <version>" in CHANGELOG.md, up to the next version.
          awk -v heading="## $VERSION" '{ sub(/\r$/, "") } $0 == heading { on = 1; next } /^## / { on = 0 } on' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q . "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for $VERSION."
            exit 1
          fi
          gh release create "v$VERSION" "$RUNNER_TEMP/cadence-$VERSION.zip" --draft --target "$GITHUB_SHA" \
            --title "cadence $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
